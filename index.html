<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환경과 생태 쫌 아는 10대 - 3D 농구 퀴즈</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #000;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.92);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            transition: all 0.5s ease;
        }
        .chapter {
            font-size: 14px;
            color: #2e7d32;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .question {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #388e3c;
        }
        #result-msg {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px #000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .slow-mo-badge {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            display: none;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }
    </style>
    <!-- Three.js 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-container">
        <div id="chapter" class="chapter">1장. 컵라면과 플랜테이션</div>
        <div id="question" class="question">Q. 열대우림과 오랑우탄 서식지를 파괴하는 컵라면용 기름은?</div>
        <div id="options" class="options"></div>
    </div>

    <div id="result-msg">SWISH!</div>
    <div id="slow-badge" class="slow-mo-badge">🎬 SLOW MOTION DUNK</div>

    <script>
        // --- 퀴즈 데이터 ---
        const quizData = [
            { ch: "1장. 컵라면과 플랜테이션", q: "열대우림과 오랑우탄 서식지를 파괴하는 컵라면용 기름은?", opts: ["올리브유", "팜유", "카놀라유", "들기름"], ans: 1 },
            { ch: "2장. 바나나와 생물다양성", q: "단일 품종(캐번디시)만 연속 재배할 때 생기는 큰 위험은?", opts: ["크기 감소", "씨앗 발생", "전염병으로 멸종 위기", "나무 과다 성장"], ans: 2 },
            { ch: "3장. 아보카도와 로컬 푸드", q: "아보카도 대량 재배 시 현지 주민을 위협하는 자원 고갈은?", opts: ["석유", "물(수자원)", "천연가스", "햇빛"], ans: 1 },
            { ch: "4장. 생수병과 플라스틱", q: "바다로 흘러가 잘게 부서진 5mm 미만의 플라스틱은?", opts: ["바이오 플라스틱", "미세 플라스틱", "합성고무", "나노 유리"], ans: 1 },
            { ch: "5장. 휴대폰과 전자 쓰레기", q: "선진국의 전자 쓰레기가 주로 유입되어 환경을 파괴하는 곳은?", opts: ["선진국 연구소", "남극", "개발도상국", "우주 정거장"], ans: 2 },
            { ch: "6장. 패스트 패션", q: "패스트 패션이 일으키는 문제가 아닌 것은?", opts: ["노동자 저임금", "수질 오염", "미세 플라스틱", "자원 순환율 급증"], ans: 3 },
            { ch: "7장. 화학물질의 역습", q: "유해 화학물질 위험을 막기 위해 가장 필요한 사회적 대응은?", opts: ["기업·국가의 규제", "소비 전면 중단", "가격 10배 인상", "가내 수공업"], ans: 0 },
            { ch: "8장. 롱패딩과 동물권", q: "동물을 인간의 도구가 아닌 생명으로 존중해야 한다는 개념은?", opts: ["동물권", "동물 복제", "동물 사육권", "생물다양성"], ans: 0 }
        ];

        let currentQ = 0;

        // --- 3D 씬 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // 조명
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0xffffff, 1);
        spotLight.position.set(0, 15, 10);
        spotLight.castShadow = true;
        scene.add(spotLight);

        // 코트 및 백보드 제작
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 림(골대)
        const hoopGroup = new THREE.Group();
        hoopGroup.position.set(0, 4, -4);
        
        const rimGeo = new THREE.TorusGeometry(0.6, 0.05, 16, 100);
        const rimMat = new THREE.MeshStandardMaterial({ color: 0xff4500 });
        const rim = new THREE.Mesh(rimGeo, rimMat);
        rim.rotation.x = Math.PI / 2;
        hoopGroup.add(rim);

        const boardGeo = new THREE.BoxGeometry(2.5, 1.8, 0.1);
        const boardMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
        const board = new THREE.Mesh(boardGeo, boardMat);
        board.position.set(0, 0.8, -0.6);
        hoopGroup.add(board);
        scene.add(hoopGroup);

        // 사람 캐릭터 제작 (Humanoid Player)
        const player = new THREE.Group();
        
        // 피부/유니폼 재질
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
        const kitMat = new THREE.MeshStandardMaterial({ color: 0x1e88e5 });

        // 머리
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), skinMat);
        head.position.y = 1.7;
        player.add(head);

        // 몸통
        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.2, 0.8, 16), kitMat);
        torso.position.y = 1.1;
        player.add(torso);

        // 팔 (오른팔)
        const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.7), kitMat);
        arm.position.set(0.35, 1.2, 0);
        arm.rotation.z = -Math.PI / 4;
        player.add(arm);

        // 다리
        const legLeft = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.08, 0.8), skinMat);
        legLeft.position.set(-0.15, 0.4, 0);
        const legRight = legLeft.clone();
        legRight.position.x = 0.15;
        player.add(legLeft);
        player.add(legRight);

        player.position.set(0, 0, 3);
        scene.add(player);

        // 농구공
        const ballGeo = new THREE.SphereGeometry(0.3, 32, 32);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xff6600 });
        const ball = new THREE.Mesh(ballGeo, ballMat);
        ball.castShadow = true;
        scene.add(ball);

        // 애니메이션 변수
        let isAnimating = false;
        let animProgress = 0;
        let isCorrectAnim = false;
        let timeScale = 1.0; // 슬로우 모션 제어용

        function resetPositions() {
            player.position.set(0, 0, 3);
            player.rotation.set(0, 0, 0);
            arm.rotation.set(0, 0, -Math.PI / 4);
            ball.position.set(0.35, 1.2, 2.6);
            camera.position.set(0, 5, 12);
            camera.lookAt(0, 2, 0);
            document.getElementById('slow-badge').style.display = 'none';
            document.getElementById('result-msg').style.opacity = '0';
        }
        resetPositions();

        // --- 퀴즈 UI 업데이트 ---
        function loadQuiz() {
            resetPositions();
            const q = quizData[currentQ];
            document.getElementById('chapter').innerText = q.ch;
            document.getElementById('question').innerText = q.q;
            
            const optsContainer = document.getElementById('options');
            optsContainer.innerHTML = '';
            
            q.opts.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = `${idx + 1}. ${opt}`;
                btn.onclick = () => selectAnswer(idx);
                optsContainer.appendChild(btn);
            });
            document.getElementById('ui-container').style.opacity = '1';
        }

        // --- 정답 선택 및 애니메이션 트리거 ---
        function selectAnswer(idx) {
            if (isAnimating) return;
            
            const isCorrect = (idx === quizData[currentQ].ans);
            document.getElementById('ui-container').style.opacity = '0'; // UI 숨기기
            
            isAnimating = true;
            animProgress = 0;
            isCorrectAnim = isCorrect;

            if (isCorrect) {
                timeScale = 0.25; // 정답일 경우 슬로우 모션 적용!
                document.getElementById('slow-badge').style.display = 'block';
            } else {
                timeScale = 1.0; // 오답은 일반 속도
            }
        }

        // --- 루프 및 슛 애니메이션 ---
        function animate() {
            requestAnimationFrame(animate);

            if (isAnimating) {
                animProgress += 0.015 * (timeScale / 1.0);

                if (isCorrectAnim) {
                    // [정답] 화려한 슬로우 모션 덩크슛 연출
                    if (animProgress < 0.4) {
                        // 돌진 및 점프
                        const t = animProgress / 0.4;
                        player.position.z = THREE.MathUtils.lerp(3, 0.5, t);
                        player.position.y = Math.sin(t * Math.PI) * 2.5;
                        
                        // 팔을 뒤로 젖힘
                        arm.rotation.x = -t * Math.PI;
                        ball.position.copy(player.position).add(new THREE.Vector3(0.2, 1.2, -0.2));

                        // 카메라 줌인 연출
                        camera.position.set(3, 3, 5);
                        camera.lookAt(player.position);
                    } 
                    else if (animProgress < 0.7) {
                        // 림으로 꽂아내리기 (덩크!)
                        const t = (animProgress - 0.4) / 0.3;
                        player.position.set(0, 2.5 - t * 0.5, -3.2);
                        arm.rotation.x = 0;
                        
                        ball.position.set(0, 4.2 - t * 1.5, -4);

                        camera.position.set(-3, 2, -1);
                        camera.lookAt(0, 4, -4);

                        if (t > 0.5) {
                            const msg = document.getElementById('result-msg');
                            msg.innerText = "💥 SLAM DUNK!!";
                            msg.style.color = "#ffeb3b";
                            msg.style.opacity = '1';
                        }
                    } 
                    else if (animProgress < 1.0) {
                        // 착지 및 골망 통과
                        const t = (animProgress - 0.7) / 0.3;
                        player.position.y = THREE.MathUtils.lerp(2, 0, t);
                        ball.position.y = THREE.MathUtils.lerp(2.7, 0.3, t);
                    } 
                    else {
                        // 애니메이션 종료 후 다음 문제로
                        finishTurn();
                    }
                } else {
                    // [오답] 노골 (에어볼/림 맞고 튕겨나감)
                    if (animProgress < 0.5) {
                        const t = animProgress / 0.5;
                        // 제자리 점프 슛
                        player.position.y = Math.sin(t * Math.PI) * 1.2;
                        ball.position.lerpVectors(new THREE.Vector3(0.35, 1.2, 2.6), new THREE.Vector3(0, 4.5, -2), t);
                    } else if (animProgress < 1.0) {
                        const t = (animProgress - 0.5) / 0.5;
                        // 빗나감
                        ball.position.set(1.5 * t, 4.5 - t * 4, -2 - t * 2);
                        player.position.y = Math.max(0, 1.2 - t * 2);

                        const msg = document.getElementById('result-msg');
                        msg.innerText = "AIR BALL... ❌";
                        msg.style.color = "#f44336";
                        msg.style.opacity = '1';
                    } else {
                        finishTurn();
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function finishTurn() {
            isAnimating = false;
            currentQ = (currentQ + 1) % quizData.length;
            loadQuiz();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 시작
        loadQuiz();
        animate();
    </script>
</body>
</html>
